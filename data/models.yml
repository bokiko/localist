    family_ref: "Qwen3 family"
    ollama: "qwen3:30b-a3b"
    why: "MoE: 30B knowledge, ~3B active — fast on RAM-rich machines."
  - id: llama32-3b
    name: "Llama 3.2 3B"
    family_ref: "Llama 3.x family"
    ollama: "llama3.2:3b"
    why: "Tiny, capable, runs almost anywhere."
  - id: llama31-8b
    name: "Llama 3.1 8B"
