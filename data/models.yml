# Model tiers by available memory — the structured form of the tables in
# guides/choosing-models.md (VRAM + Mac) and guides/cpu-only.md (CPU).
#
# THREE tier groups by memory type, because bandwidth differs sharply:
#   vram     -> GPU tiers (choosing-models.md VRAM table)
#   mac_ram  -> Apple Silicon unified memory (choosing-models.md Mac table)
#   cpu_ram  -> plain system RAM (cpu-only.md table) — calibrated DOWN vs Mac,
#               so a CPU beginner is told what runs well, not merely what fits.
#
# `catalog` holds example models; every `family_ref` MUST match a curated.yml
# model entry (models_general / models_coding) so this file never becomes a
# second source of truth. All rules enforced by tests/test_models_contract.py.
#
# Hand-curated and dated for V1 — NOT pipeline-fed.

version: 1

tiers:
  # ── VRAM tiers (NVIDIA / AMD GPU paths) — choosing-models.md VRAM table ──
  - id: t1
    basis: vram
    memory: "8 GB"
    size_class: "1B–4B"
    examples: [qwen3-4b, phi4-mini, gemma3-4b, llama32-3b]
    expectations: "Small models. Great for chat, summaries, and quick questions — not heavy coding."
  - id: t2
    basis: vram
    memory: "12 GB"
    size_class: "7B–8B"
    examples: [qwen3-8b, llama31-8b]
    expectations: "The 7–8B sweet spot: a genuinely useful daily driver, fast on-GPU."
  - id: t3
    basis: vram
    memory: "16 GB"
    size_class: "14B"
    examples: [qwen3-14b, gemma3-12b]
    expectations: "14B-class models — noticeably sharper for real work."
  - id: t4
    basis: vram
    memory: "24 GB"
    size_class: "30B–32B"
    examples: [qwen3-32b, gemma3-27b, devstral-small]
    expectations: "30B/32B-class quality that rivals cloud chatbots for many tasks."
  - id: t5
    basis: vram
    memory: "48 GB+"
    size_class: "70B"
    examples: [llama33-70b, r1-distill-70b]
    expectations: "70B-class models — the big leagues, if your hardware can hold them."

  # ── Apple Silicon tiers (unified memory) — choosing-models.md Mac table ──
  - id: mac1
    basis: mac_ram
    memory: "8 GB"
    size_class: "3B–4B"
    examples: [qwen3-4b, llama32-3b]
    expectations: "Small models fit in ~4–5 GB of usable memory. Fine for chat and summaries."
  - id: mac2
    basis: mac_ram
    memory: "16 GB"
    size_class: "7B–8B"
    examples: [qwen3-8b]
    expectations: "The 7–8B daily-driver tier — quick on Apple Silicon's fast unified memory."
  - id: mac3
    basis: mac_ram
    memory: "32 GB"
    size_class: "14B, fast 30B-class MoE"
    examples: [qwen3-14b, qwen3-30b-a3b]
    expectations: "14B dense, or a fast 30B-A3B MoE — the unified-memory sweet spot."
  - id: mac4
    basis: mac_ram
    memory: "64 GB+"
    size_class: "70B"
    examples: [llama33-70b]
    expectations: "70B-class models on a big-memory Mac."

  # ── CPU-only tiers (plain system RAM) — cpu-only.md table ────────────────
  # Calibrated below the Mac tiers: same RAM, far less bandwidth. Honest copy.
  - id: cpu1
    basis: cpu_ram
    memory: "8 GB"
    size_class: "1B–4B"
    examples: [qwen3-1-7b, phi4-mini]
    expectations: "Quick answers and light chat. Slower than a GPU or Apple Silicon Mac — that's normal for CPU. Keep prompts and context short."
  - id: cpu2
    basis: cpu_ram
    memory: "16 GB"
    size_class: "3B–4B"
    examples: [qwen3-4b]
    expectations: "A solid daily assistant at a patient pace. A smaller current model feels better than a larger one that crawls."
  - id: cpu3
    basis: cpu_ram
    memory: "32 GB"
    size_class: "7B–8B dense; optional 30B-A3B MoE"
    examples: [qwen3-8b, qwen3-30b-a3b]
    expectations: "Start with Qwen3 8B — good quality at a patient CPU pace. With enough free RAM, the 30B-A3B MoE is an optional step up: it activates only a few billion params per token, so it stays usable on CPU. Long documents and big context windows are where CPU hurts most — keep them modest."
  - id: cpu4
    basis: cpu_ram
    memory: "64 GB+"
    size_class: "30B-A3B MoE"
    examples: [qwen3-30b-a3b]
    expectations: "Enough RAM for a 30B-A3B MoE — it activates only a few billion params per token, so it stays usable on CPU. Dense models this big will crawl; prefer the MoE."

