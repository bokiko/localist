name: Report a stale entry
description: Flag an abandoned tool, broken instruction, or outdated recommendation
title: "[stale] "
labels: [stale-report]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping prune dead or risky recommendations.

        If a third-party link, download, install command, or project looks
        compromised or malicious, **do not post details in this public issue**.
        Use the repository Security tab -> "Report a vulnerability", or follow
        `SECURITY.md`, so the maintainer can review it privately first.
  - type: input
    id: entry
    attributes:
      label: Which tool, page, or guide?
      description: Use the visible name first. File paths are optional if you know them.
      placeholder: e.g. "LM Studio in The essentials" or "AMD guide step 2"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What's wrong?
      options:
        - Project appears abandoned (no commits or releases in 3+ months)
        - Instructions no longer work
        - Model recommendation is outdated
        - Link is dead
        - Unsafe or dangerous instruction in a Localist guide
        - Other (explain below)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: >
        What did you observe? Include what you clicked or ran, what happened,
        what you expected, and your OS or hardware if it matters. Links or error
        messages help a lot. If this is about a compromised or malicious
        third-party download, stop here and use the repository Security tab ->
        "Report a vulnerability" instead. Remove private details first: tokens,
        API keys, account names, private file paths, machine names, screenshots
        with secrets, and anything not meant for a public GitHub issue.
    validations:
      required: true
