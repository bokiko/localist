name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so test_git_hygiene.py's `git log --all` is meaningful

      - uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run pytest
