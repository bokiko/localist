# Model tiers by available memory — the structured form of the tables in
# guides/choosing-models.md.
#
# `tiers` map a memory bucket to a size class + example models + honest
# expectations. `catalog` holds the example models; every catalog entry's
# `family_ref` MUST match a model entry in curated.yml (models_general or
# models_coding) so this file never becomes a second source of truth.
# Both rules are enforced by tests/test_models_contract.py.
#
# Hand-curated and dated for V1 — NOT pipeline-fed. Update alongside
# choosing-models.md and curated.yml.

version: 1

tiers:
  # ── VRAM tiers (NVIDIA / AMD GPU paths) ──────────────────────────────
  - id: t1
    basis: vram
    memory: "8 GB"
    size_class: "1B–4B"
    examples: [qwen3-4b, phi4-mini, gemma3-4b, llama32-3b]
    expectations: "Small models. Great for chat, summaries, and quick questions — not heavy coding."
  - id: t2
    basis: vram
    memory: "12 GB"
    size_class: "7B–8B"
    examples: [qwen3-8b, llama31-8b]
    expectations: "The 7–8B sweet spot: a genuinely useful daily driver."
  - id: t3
    basis: vram
    memory: "16 GB"
    size_class: "14B"
    examples: [qwen3-14b, gemma3-12b]
    expectations: "14B-class models — noticeably sharper for real work."
  - id: t4
    basis: vram
    memory: "24 GB"
    size_class: "30B–32B"
    examples: [qwen3-32b, gemma3-27b, devstral-small]
    expectations: "30B/32B-class quality that rivals cloud chatbots for many tasks."
  - id: t5
    basis: vram
    memory: "48 GB+"
    size_class: "70B"
    examples: [llama33-70b, r1-distill-70b]
    expectations: "70B-class models — the big leagues, if your hardware can hold them."

  # ── RAM tiers (CPU-only and Apple Silicon paths) ─────────────────────
  - id: t1c
    basis: ram
    memory: "8 GB"
    size_class: "3B–4B"
    examples: [qwen3-4b, llama32-3b]
    expectations: "Small models fit in ~4–5 GB of usable RAM. Fine for chat and summaries."
  - id: t2c
    basis: ram
    memory: "16 GB"
    size_class: "7B–8B"
    examples: [qwen3-8b]
    expectations: "The 7–8B daily-driver tier on CPU or a 16 GB Mac."
  - id: t3c
    basis: ram
    memory: "32 GB"
    size_class: "14B, fast 30B-class MoE"
    examples: [qwen3-14b, qwen3-30b-a3b]
    expectations: "14B dense, or a fast 30B-A3B MoE — the RAM-rich sweet spot."
  - id: t4c
    basis: ram
    memory: "64 GB+"
    size_class: "70B"
    examples: [llama33-70b]
    expectations: "70B-class models on a big-memory Mac or workstation."

# Example models referenced by tiers. family_ref must match a curated.yml
# model entry name (models_general / models_coding).
catalog:
  - id: qwen3-4b
    name: "Qwen3 4B"
    family_ref: "Qwen3 family"
    ollama: "qwen3:4b"
    why: "Strong tiny general model."
  - id: qwen3-8b
    name: "Qwen3 8B"
    family_ref: "Qwen3 family"
    ollama: "qwen3:8b"
    why: "The daily-driver sweet spot."
  - id: qwen3-14b
    name: "Qwen3 14B"
